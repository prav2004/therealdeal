<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Pickr - Maintenance</title>
    <link rel="icon" type="image/png" sizes="16x16" href="tablogo.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="tablogo.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="tablogo.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="tablogo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="tablogo.png" />
    <link rel="manifest" href="manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: radial-gradient(circle at top, rgba(122, 167, 255, 0.2), transparent 45%),
          radial-gradient(circle at 10% 20%, rgba(64, 217, 181, 0.25), transparent 40%),
          #0b0f1a;
        color: #e5e7eb;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      }
      main {
        flex: 1;
        display: grid;
        place-items: center;
        width: 100%;
      }
      .card {
        width: min(560px, 92vw);
        padding: 2.5rem 2.75rem;
        border-radius: 24px;
        background: rgba(12, 18, 32, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 28px 60px rgba(0, 0, 0, 0.55);
        text-align: center;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 2.1rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        color: rgba(226, 232, 240, 0.8);
        font-size: 1rem;
        line-height: 1.6;
      }
      .badge {
        display: inline-block;
        margin-bottom: 1rem;
        padding: 0.35rem 0.75rem;
        border-radius: 999px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-size: 0.7rem;
        background: rgba(255, 122, 26, 0.18);
        border: 1px solid rgba(255, 122, 26, 0.35);
        color: #ffcfad;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <img src="logo.png" alt="Pickr logo" style="height:160px;width:160px;object-fit:contain;margin:0 auto 1.5rem;" />
        <div class="badge">Maintenance</div>
        <h1>Pickr is offline for updates</h1>
        <p>We are making a few improvements. Please check back shortly.</p>
      </div>
    </main>
    <footer style="width:100%;border-top:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.04);padding:20px 0;">
      <div style="max-width:1000px;margin:0 auto;padding:0 16px;display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center;font-size:12px;color:#cbd5f5;">
        <div>© 2026 Pickr. Free-to-play. 19+ only in Canada.</div>
        <div style="display:flex;flex-wrap:wrap;gap:12px;">
          <a href="contact.html" style="color:#e2e8f0;text-decoration:none;">Contact</a>
          <a href="faq.html" style="color:#e2e8f0;text-decoration:none;">FAQ</a>
          <a href="terms.html" style="color:#e2e8f0;text-decoration:none;">Terms</a>
          <a href="careers.html" style="color:#e2e8f0;text-decoration:none;">Careers</a>
        </div>
      </div>
    </footer>
  </body>
</html>
