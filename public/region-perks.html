<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pickr – Regional Perks</title>
    <link rel="icon" type="image/png" href="tablogo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="config.js"></script>
    <script src="js/region.js"></script>
  </head>
  <body class="min-h-screen bg-slate-950 px-5 text-slate-100" style="background:radial-gradient(circle at 12% 12%,rgba(64,217,181,.16),transparent 30%),radial-gradient(circle at 88% 10%,rgba(255,122,26,.17),transparent 34%),#0b0f1a;">
    <main class="mx-auto flex min-h-screen max-w-xl items-center py-10">
      <section class="w-full rounded-3xl border border-white/10 bg-slate-900/80 p-7 text-center shadow-2xl backdrop-blur sm:p-10">
        <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-orange-400/15 text-3xl">🎁</div>
        <p class="mt-6 text-xs font-bold uppercase tracking-[.25em] text-emerald-300">Regional Pickr Perks</p>
        <h1 class="mt-3 text-3xl font-bold tracking-tight">Perks for <span data-region-label></span></h1>
        <p class="mx-auto mt-4 max-w-md text-sm leading-6 text-slate-400">This regional perks destination is being connected. Your sports picks, insights, and profile stay the same.</p>
        <a href="index.html" class="mt-7 inline-flex rounded-full bg-orange-400 px-5 py-3 text-sm font-bold text-slate-950">Back to Sports</a>
        <p class="mt-5 text-xs text-slate-500">Need a different region? Change it on the Sports page.</p>
      </section>
    </main>
  </body>
</html>
