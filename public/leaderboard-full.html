<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Full Leaderboard · Pickr</title>
    <link rel="manifest" href="manifest.json" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/pickr-ui.css?v=1" />
    <style>
      :root {
        --ink: #0b0f1a;
        --ember: #ff7a1a;
        --mint: #40d9b5;
        --gold: #ffd700;
        --silver: #c0c0c0;
        --bronze: #cd7f32;
        --card: rgba(255,255,255,0.045);
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; }
      body {
        font-family: 'IBM Plex Sans', system-ui, sans-serif;
        background: var(--ink);
        color: #e2e8f0;
        min-height: 100dvh;
        overscroll-behavior: none;
        padding-top: env(safe-area-inset-top);
      }

      /* ── Page loader ── */
      #pageLoader {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: var(--ink); transition: opacity .6s ease;
      }
      #pageLoader.loaded { opacity: 0; pointer-events: none; }
      .loader-ball {
        width: 38px; height: 38px; border-radius: 50%;
        background: radial-gradient(circle at 38% 35%, #ffb347 0%, #ff7a1a 45%, #c05600 100%);
        box-shadow: inset -4px -6px 10px rgba(0,0,0,.35), inset 2px 2px 6px rgba(255,220,160,.4);
        animation: ballBounce 0.55s cubic-bezier(0.3,0,0.7,1) infinite alternate;
      }
      .loader-shadow {
        width: 38px; height: 8px; border-radius: 50%;
        background: rgba(255,122,26,.25); filter: blur(3px); margin-top: 4px;
        animation: shadowPulse 0.55s cubic-bezier(0.3,0,0.7,1) infinite alternate;
      }
      @keyframes ballBounce {
        0%   { transform: translateY(0) scaleX(1) scaleY(1); }
        80%  { transform: translateY(36px) scaleX(1) scaleY(1); }
        100% { transform: translateY(36px) scaleX(1.18) scaleY(0.82); }
      }
      @keyframes shadowPulse {
        0%   { transform: scaleX(0.6); opacity: 0.3; }
        100% { transform: scaleX(1.2); opacity: 0.7; }
      }

      /* ── Back button ── */
      .back-btn {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 8px 16px; border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(255,255,255,0.06);
        color: #94a3b8; font-size: 0.8rem; font-weight: 600;
        letter-spacing: 0.03em; cursor: pointer; text-decoration: none;
        transition: all 0.2s ease; font-family: 'Space Grotesk', sans-serif;
      }
      .back-btn:hover { background: rgba(255,255,255,0.11); color: #e2e8f0; border-color: rgba(255,255,255,0.22); transform: translateX(-2px); }
      .back-btn svg { width: 15px; height: 15px; }

      /* ── Top bar ── */
      .top-bar {
        position: sticky; top: 0; z-index: 40;
        background: rgba(11,15,26,0.92);
        backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(255,255,255,0.06);
        padding: 12px 20px;
        display: flex; align-items: center; gap: 12px;
      }
      .bar-title {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700; font-size: 1.05rem; color: #f1f5f9; letter-spacing: -0.01em;
      }
      .bar-badge {
        margin-left: auto; display: inline-flex; align-items: center; gap: 5px;
        padding: 4px 10px; border-radius: 999px;
        background: rgba(64,217,181,0.12); border: 1px solid rgba(64,217,181,0.22);
        color: #40d9b5; font-size: 0.7rem; font-weight: 600;
        letter-spacing: 0.08em; font-family: 'Space Grotesk', sans-serif;
      }
      .live-dot {
        width: 6px; height: 6px; border-radius: 50%; background: #40d9b5;
        animation: pulse-dot 1.6s ease infinite;
      }
      @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.7); }
      }

      /* ── Podium ── */
      .podium-wrap {
        display: flex; align-items: flex-end; justify-content: center;
        gap: 10px; padding: 36px 12px 0;
      }
      .podium-card { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1; max-width: 130px; }
      .podium-card.first { order: 2; }
      .podium-card.second { order: 1; }
      .podium-card.third { order: 3; }

      .podium-avatar-wrap { position: relative; margin-bottom: 2px; }
      .podium-avatar-ring { border-radius: 50%; padding: 3px; }
      .podium-avatar-ring.gold   { background: linear-gradient(135deg, #ffd700, #ffb300, #ff8c00); }
      .podium-avatar-ring.silver { background: linear-gradient(135deg, #e8e8e8, #b0b0b0, #888); }
      .podium-avatar-ring.bronze { background: linear-gradient(135deg, #e8a87c, #cd7f32, #8b4513); }

      .podium-avatar { border-radius: 50%; background: rgba(255,255,255,0.07); overflow: hidden; }
      .podium-avatar.lg { width: 68px; height: 68px; }
      .podium-avatar.md { width: 56px; height: 56px; }

      .podium-crown { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 20px; line-height: 1; }

      .podium-name {
        font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 0.78rem;
        color: #f1f5f9; text-align: center; max-width: 110px;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .podium-pts { font-family: 'Space Grotesk', sans-serif; font-weight: 800; font-size: 0.95rem; color: #40d9b5; text-align: center; }
      .podium-pts.first { font-size: 1.1rem; }

      .podium-block {
        width: 100%; border-radius: 12px 12px 0 0;
        display: flex; align-items: center; justify-content: center;
        padding: 8px 0; font-family: 'Space Grotesk', sans-serif; font-weight: 800; font-size: 1.3rem;
      }
      .podium-block.first  { min-height: 64px; background: linear-gradient(180deg, rgba(255,215,0,0.18) 0%, rgba(255,215,0,0.06) 100%); border: 1px solid rgba(255,215,0,0.22); color: #ffd700; }
      .podium-block.second { min-height: 44px; background: linear-gradient(180deg, rgba(192,192,192,0.14) 0%, rgba(192,192,192,0.04) 100%); border: 1px solid rgba(192,192,192,0.18); color: #c0c0c0; }
      .podium-block.third  { min-height: 32px; background: linear-gradient(180deg, rgba(205,127,50,0.14) 0%, rgba(205,127,50,0.04) 100%); border: 1px solid rgba(205,127,50,0.18); color: #cd7f32; }

      /* ── Player rows ── */
      .player-row {
        display: flex; align-items: center; padding: 14px 18px; gap: 14px;
        border-bottom: 1px solid rgba(255,255,255,0.05); transition: background 0.15s;
      }
      .player-row:last-child { border-bottom: none; }
      .player-row:hover { background: rgba(255,255,255,0.03); }

      .rank-badge {
        font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 0.82rem;
        color: #64748b; min-width: 32px; text-align: center; flex-shrink: 0;
      }
      .rank-badge.top10 { color: #ff7a1a; }

      .player-info { flex: 1; min-width: 0; }
      .player-name {
        font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 0.9rem;
        color: #f1f5f9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .player-sub { font-size: 0.72rem; color: #64748b; margin-top: 2px; }

      .stat-pill { display: flex; flex-direction: column; align-items: flex-end; min-width: 48px; flex-shrink: 0; }
      .stat-val { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 0.9rem; color: #40d9b5; }
      .stat-lbl { font-size: 0.62rem; color: #475569; letter-spacing: 0.06em; text-transform: uppercase; margin-top: 1px; }

      /* ── Column header row ── */
      .col-hdr {
        display: flex; align-items: center; padding: 10px 18px; gap: 14px;
        background: rgba(11,15,26,0.7); border-bottom: 1px solid rgba(255,255,255,0.07);
        position: sticky; top: 53px; z-index: 30;
      }
      .col-hdr-label { font-size: 0.62rem; letter-spacing: 0.1em; color: #475569; text-transform: uppercase; font-family: 'Space Grotesk', sans-serif; }

      /* ── Section divider ── */
      .section-divider { display: flex; align-items: center; gap: 12px; padding: 24px 0 12px; }
      .section-divider span {
        font-family: 'Space Grotesk', sans-serif; font-size: 0.68rem; font-weight: 700;
        letter-spacing: 0.12em; text-transform: uppercase; color: #475569; white-space: nowrap;
      }
      .divider-line { flex: 1; height: 1px; background: rgba(255,255,255,0.06); }

      /* ── Skeleton loading ── */
      .skeleton {
        background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.09) 50%, rgba(255,255,255,0.04) 75%);
        background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 8px;
      }
      @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

      /* ── Pickr avatar (from script.js) ── */
      .pickr-avatar {
        border-radius: 999px !important; position: relative !important;
        overflow: hidden !important; transform: translateZ(0) !important;
        will-change: transform !important; contain: layout style size !important;
      }

      /* ── Confetti canvas ── */
      #confettiCanvas {
        position: fixed; inset: 0; pointer-events: none; z-index: 9999;
        width: 100%; height: 100%;
      }

      /* ── #4 first-row glow separator ── */
      .player-row.rank-four-first {
        box-shadow: inset 0 4px 16px -4px rgba(255,122,26,0.18);
        border-top: 1px solid rgba(255,122,26,0.18);
      }

      /* ── Load more button ── */
      #loadMoreLeaderboard {
        display: flex; align-items: center; justify-content: center;
        width: 100%; max-width: 260px; margin: 20px auto;
        padding: 11px 20px; border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.1);
        background: rgba(255,255,255,0.04);
        color: #94a3b8; font-size: 0.78rem; font-weight: 600;
        letter-spacing: 0.08em; text-transform: uppercase;
        cursor: pointer; font-family: 'Space Grotesk', sans-serif; transition: all 0.2s;
      }
      #loadMoreLeaderboard:hover:not(:disabled) { background: rgba(255,122,26,0.1); border-color: rgba(255,122,26,0.3); color: #ff7a1a; }
      #loadMoreLeaderboard:disabled { opacity: 0.5; cursor: not-allowed; }

      /* ── Bottom nav ── */
      .bottom-nav {
        position: fixed; bottom: 0; left: 0; right: 0;
        background: rgba(11,15,26,0.95);
        backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        border-top: 1px solid rgba(255,255,255,0.06);
        display: flex; padding-bottom: env(safe-area-inset-bottom); z-index: 50;
      }
      .nav-link {
        flex: 1; display: flex; flex-direction: column; align-items: center;
        padding: 8px 4px; text-decoration: none; color: #475569;
        font-size: 0.62rem; font-weight: 600; letter-spacing: 0.04em;
        font-family: 'Space Grotesk', sans-serif; transition: color 0.15s; gap: 3px;
      }
      .nav-link:hover, .nav-link.active { color: #ff7a1a; }
      .nav-icon { font-size: 1.25rem; line-height: 1; }

      /* ── Desktop ── */
      @media (min-width: 768px) {
        .page-content { max-width: 680px; margin: 0 auto; }
        .podium-card { max-width: 160px; }
        .podium-avatar.lg { width: 80px; height: 80px; }
        .podium-avatar.md { width: 64px; height: 64px; }
        .player-row { padding: 16px 24px; }
        .col-hdr { padding: 12px 24px; top: 57px; }
      }
    </style>
  </head>

        function makeAvatar(avatarId,size){

          el.className='pickr-avatar';
          el.setAttribute('data-size',String(size));
          if(avatarId) el.setAttribute('data-avatar-id',avatarId);

        function renderPodium(top3){

          const avSizes=[56,68,56];
          const avClasses=['md','lg','md'];
          podiumPlayers.innerHTML='';
          slots.forEach((player,i)=>{
            if(!player) return;
            const card=document.createElement('div');
            card.className='podium-card '+medals[i];
            const avWrap=document.createElement('div');
            avWrap.className='podium-avatar-wrap';
            if(medals[i]==='first'){const crown=document.createElement('div');crown.className='podium-crown';crown.textContent='👑';avWrap.appendChild(crown);}
            const ring=document.createElement('div'); ring.className='podium-avatar-ring '+medals[i];
            const avDiv=document.createElement('div'); avDiv.className='podium-avatar '+avClasses[i];
            avDiv.appendChild(makeAvatar(player.avatarId,avSizes[i]));
            ring.appendChild(avDiv); avWrap.appendChild(ring); card.appendChild(avWrap);
            const nameEl=document.createElement('div'); nameEl.className='podium-name'; nameEl.textContent=player.name||'—'; card.appendChild(nameEl);
            const ptsEl=document.createElement('div'); ptsEl.className='podium-pts '+medals[i]; ptsEl.textContent=Number(player.points||0).toLocaleString()+' pts'; card.appendChild(ptsEl);
            const block=document.createElement('div'); block.className='podium-block '+medals[i]; block.textContent='#'+labels[i]; card.appendChild(block);
            podiumPlayers.appendChild(card);
          });
          podiumSection.style.display='';
          restDivider.style.display='flex';
          colHdr.style.display='flex';
        }

        function renderRows(players,append){
          const sk=document.getElementById('skeletonRows'); if(sk) sk.remove();
          if(!players||players.length===0){ if(!append) listEl.innerHTML='<div style="padding:32px;text-align:center;color:#475569;font-size:0.85rem;font-family:Space Grotesk,sans-serif;">No leaderboard data yet.</div>'; return; }
          let firstIdx=0;
          if(totalRendered===0&&players.length>=1){
            const n=Math.min(3,players.length);
            renderPodium(players.slice(0,n));
            firstIdx=n; totalRendered+=n;
            // 🎉 Confetti burst for top 3 reveal
            setTimeout(launchConfetti, 180);
          }
          let added=0;
          for(let i=firstIdx;i<players.length;i++){
            const p=players[i];
            const nameRaw=String(p.name||'').trim();
            if(!nameRaw||!/^[A-Za-z0-9_.\- ]+$/.test(nameRaw)) continue;
            added++;
            const rank=totalRendered+added;
            const row=document.createElement('div'); row.className='player-row'+(rank===4?' rank-four-first':'');
            const rb=document.createElement('div'); rb.className='rank-badge'+(rank<=10?' top10':''); rb.textContent='#'+rank; row.appendChild(rb);
            row.appendChild(makeAvatar(p.avatarId,38));
            const info=document.createElement('div'); info.className='player-info';
            const pn=document.createElement('div'); pn.className='player-name'; pn.textContent=nameRaw; info.appendChild(pn);
            const ps=document.createElement('div'); ps.className='player-sub';
            const wins=Number(p.wins||0),streak=Number(p.streakWins||0);
            ps.textContent=wins+' wins'+(streak>0?'  ·  '+streak+(streak>=3?'🔥':'')+' streak':'');
            if(streak>=3) ps.style.color='#ff7a1a';
            info.appendChild(ps); row.appendChild(info);
            const sp=document.createElement('div'); sp.className='stat-pill';
            const sv=document.createElement('div'); sv.className='stat-val'; sv.textContent=Number(p.points||0).toLocaleString(); sp.appendChild(sv);
            const sl=document.createElement('div'); sl.className='stat-lbl'; sl.textContent='pts'; sp.appendChild(sl);
            row.appendChild(sp); listEl.appendChild(row);
          }
          totalRendered+=added;
          if(window.PickrApp&&typeof window.PickrApp.refreshAvatars==='function') window.PickrApp.refreshAvatars();
        }

        async function loadMore(){
          if(loading||done) return;
          loading=true; loadMoreBtn.disabled=true; loadMoreBtn.textContent='Loading…';
          if(statusEl) statusEl.textContent='';
          try{
            const headers=await getAuthHeaders();
            const params=new URLSearchParams({limit:'100'});
            if(cursor) params.set('startAfterPoints',String(cursor.startAfterPoints));
            const res=await fetch(apiBase+'/api/leaderboard/players?'+params.toString(),{headers});
            const data=await res.json();
            if(!res.ok) throw new Error(data&&data.error?data.error:'Failed');
            renderRows(data.players||[],!!cursor);
            cursor=data.nextCursor||null;
            if(!cursor||!data.players||data.players.length<50){ done=true; loadMoreBtn.style.display='none'; if(statusEl) statusEl.textContent='All '+totalRendered+' players loaded'; }
          }catch(err){ if(statusEl) statusEl.textContent='Failed to load. Try again.'; }
          finally{ loading=false; loadMoreBtn.disabled=false; loadMoreBtn.textContent='Load more players'; }
        }

        document.addEventListener('DOMContentLoaded',loadMore);
        loadMoreBtn.addEventListener('click',loadMore);
      })();

      // ── Confetti engine ──────────────────────────────────────────────
      (function(){
        const canvas = document.getElementById('confettiCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let W, H, particles = [], raf;
        const COLORS = ['#ffd700','#ff7a1a','#40d9b5','#ffffff','#ff9ecd','#c0c0c0','#a78bfa','#fbbf24'];

        function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        function makeParticle(){
          const x = Math.random() * W;
          const s = (Math.random() * 8 + 5);
          return {
            x, y: -10 - Math.random() * 80,
            vx: (Math.random() - 0.5) * 3.5,
            vy: Math.random() * 3 + 2.5,
            size: s,
            color: COLORS[Math.floor(Math.random() * COLORS.length)],
            rot: Math.random() * Math.PI * 2,
            rotSpeed: (Math.random() - 0.5) * 0.18,
            shape: Math.random() < 0.55 ? 'rect' : 'circle',
            alpha: 1,
            life: 0,
            maxLife: 110 + Math.floor(Math.random() * 80)
          };
        }

        function drawParticle(p){
          ctx.save();
          ctx.globalAlpha = p.alpha;
          ctx.fillStyle = p.color;
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          if (p.shape === 'rect') {
            ctx.fillRect(-p.size / 2, -p.size * 0.38, p.size, p.size * 0.55);
          } else {
            ctx.beginPath();
            ctx.arc(0, 0, p.size * 0.44, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        function loop(){
          ctx.clearRect(0, 0, W, H);
          for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vx += (Math.random() - 0.5) * 0.12;
            p.vy += 0.07;
            p.rot += p.rotSpeed;
            p.life++;
            if (p.life > p.maxLife * 0.65) p.alpha = 1 - (p.life - p.maxLife * 0.65) / (p.maxLife * 0.35);
            if (p.life >= p.maxLife || p.y > H + 20) { particles.splice(i, 1); }
            else drawParticle(p);
          }
          if (particles.length > 0) raf = requestAnimationFrame(loop);
          else { ctx.clearRect(0, 0, W, H); raf = null; }
        }

        window.launchConfetti = function(){
          if (raf) cancelAnimationFrame(raf);
          particles = [];
          // First burst — wide spread
          for (let i = 0; i < 120; i++) particles.push(makeParticle());
          // Second burst 300ms later — trickle
          setTimeout(() => { for (let i = 0; i < 60; i++) particles.push(makeParticle()); }, 320);
          raf = requestAnimationFrame(loop);
        };
      })();
    </script>
