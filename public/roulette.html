    <script>
    /* ──────────────────────────────────────
       WHEEL DATA  (European order)
    ────────────────────────────────────── */
    const WHEEL_ORDER = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
    const NUM_SLOTS   = 37;
    const SLOT_ANG    = (Math.PI * 2) / NUM_SLOTS;
    const RED_SET  = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
    const BLACK_SET= new Set([2,4,6,8,10,11,13,15,17,20,22,24,26,28,29,31,33,35]);
    function numColor(n){ if(n===0)return 'green'; return RED_SET.has(n)?'red':'black'; }

    /* ──────────────────────────────────────
       CANVAS  SETUP
    ────────────────────────────────────── */
    const canvas = document.getElementById('wheelCanvas');
    const ctx    = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const CX = W/2, CY = H/2;

    const R_RIM   = CX - 6;        // outermost gold edge
    const R_BALL  = R_RIM - 18;    // ball track centre radius
    const R_SEG   = R_BALL - 12;   // segment outer edge
    const R_HUB   = Math.round(R_SEG * 0.36); // hub radius

    let wheelAngle = 0;
    let wheelVel   = 0;
    let ballAngle  = 0;
    let ballR      = R_BALL;
    let phase      = 'idle';   // idle | spin | settle | done
    let targetIdx  = 0;
    let doneCb     = null;
    let rafId      = null;

    const SEG_FILL = { red:'#c0392b', black:'#111827', green:'#16a34a' };

    function drawWheel(wa) {
      ctx.clearRect(0,0,W,H);

      /* gold outer band */
      ctx.beginPath(); ctx.arc(CX,CY,R_RIM+8,0,Math.PI*2);
      ctx.fillStyle='#7a5910'; ctx.fill();
      ctx.beginPath(); ctx.arc(CX,CY,R_RIM+3,0,Math.PI*2);
      ctx.fillStyle='#d4ac2a'; ctx.fill();

      /* dark ring inside rim */
      ctx.beginPath(); ctx.arc(CX,CY,R_RIM,0,Math.PI*2);
      ctx.fillStyle='#0a0c04'; ctx.fill();

      /* ball track groove (subtle highlight) */
      ctx.beginPath(); ctx.arc(CX,CY,R_BALL+1,0,Math.PI*2);
      ctx.strokeStyle='rgba(255,255,255,.07)'; ctx.lineWidth=18; ctx.stroke();

      /* coloured segments */
      for(let i=0; i<NUM_SLOTS; i++){
        const num = WHEEL_ORDER[i];
        const sa  = wa + i*SLOT_ANG - Math.PI/2;
        const ea  = sa + SLOT_ANG;
        ctx.beginPath();
        ctx.moveTo(CX,CY);
        ctx.arc(CX,CY,R_SEG,sa,ea);
        ctx.closePath();
        ctx.fillStyle = SEG_FILL[numColor(num)];
        ctx.fill();
        ctx.strokeStyle = 'rgba(200,167,82,.3)';
        ctx.lineWidth = 0.6;
        ctx.stroke();

        /* number label */
        const mid = sa + SLOT_ANG/2;
        const tx  = CX + Math.cos(mid)*(R_SEG - 14);
        const ty  = CY + Math.sin(mid)*(R_SEG - 14);
        ctx.save();
        ctx.translate(tx, ty);
        ctx.rotate(mid + Math.PI/2);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 9px IBM Plex Sans';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(num), 0, 0);
        ctx.restore();
      }

      /* thin spoke lines from hub to seg edge */
      for(let i=0; i<NUM_SLOTS; i++){
        const a = wa + i*SLOT_ANG - Math.PI/2;
        ctx.beginPath();
        ctx.moveTo(CX+Math.cos(a)*R_HUB, CY+Math.sin(a)*R_HUB);
        ctx.lineTo(CX+Math.cos(a)*R_SEG,  CY+Math.sin(a)*R_SEG);
        ctx.strokeStyle='rgba(200,167,82,.18)'; ctx.lineWidth=0.8; ctx.stroke();
      }

      /* hub */
      const hg = ctx.createRadialGradient(CX,CY,2,CX,CY,R_HUB);
      hg.addColorStop(0,'#2d3748'); hg.addColorStop(1,'#0d1117');
      ctx.beginPath(); ctx.arc(CX,CY,R_HUB,0,Math.PI*2);
      ctx.fillStyle=hg; ctx.fill();
      ctx.strokeStyle='rgba(200,167,82,.55)'; ctx.lineWidth=2; ctx.stroke();

      /* centre bolt */
      ctx.beginPath(); ctx.arc(CX,CY,5,0,Math.PI*2);
      ctx.fillStyle='#d4ac2a'; ctx.fill();
    }

    function drawBall(ba, br) {
      const bx = CX + Math.cos(ba)*br;
      const by = CY + Math.sin(ba)*br;
      /* shadow */
      ctx.beginPath(); ctx.arc(bx+2,by+2,7,0,Math.PI*2);
      ctx.fillStyle='rgba(0,0,0,.38)'; ctx.fill();
      /* gradient sphere */
      const g = ctx.createRadialGradient(bx-2,by-2,1,bx,by,7);
      g.addColorStop(0,'#f2f2f2'); g.addColorStop(.6,'#bbb'); g.addColorStop(1,'#4a4a4a');
      ctx.beginPath(); ctx.arc(bx,by,7,0,Math.PI*2);
      ctx.fillStyle=g; ctx.fill();
    }

    function frame() {
      drawWheel(wheelAngle);
      if(phase !== 'idle') drawBall(ballAngle, ballR);
    }

    function animLoop(){
      if(phase === 'spin'){
        wheelAngle += wheelVel;
        ballAngle  -= ballVel;        /* ball travels opposite direction */
        ballVel    *= 0.9993;
        wheelVel   *= 0.9986;
        ballR = R_BALL;               /* stays in track groove */
        if(Math.abs(wheelVel) < 0.022){ phase = 'settle'; }
      }
      else if(phase === 'settle'){
        wheelAngle += wheelVel;
        wheelVel   *= 0.983;

        /* world-space angle of winning slot's centre */
        const slotWorld = wheelAngle + targetIdx*SLOT_ANG + SLOT_ANG/2 - Math.PI/2;

        /* ease ball toward that angle */
        let diff = slotWorld - ballAngle;
        diff -= Math.round(diff / (Math.PI*2)) * Math.PI*2;
        ballAngle += diff * 0.07;

        /* drop ball inward toward pocket */
        const pocketR = R_SEG - 16;
        ballR += (pocketR - ballR) * 0.045;

        if(Math.abs(wheelVel) < 0.0008){
          phase = 'done'; wheelVel = 0;
          ballAngle = slotWorld; ballR = pocketR;
          frame();
          if(doneCb){ doneCb(); doneCb = null; }
          return;
        }
      }
      frame();
      rafId = requestAnimationFrame(animLoop);
    }

    function spinWheel(winNum, cb){
      targetIdx = WHEEL_ORDER.indexOf(winNum);
      wheelVel  = 0.10 + Math.random()*0.04;
      ballVel   = 0.23 + Math.random()*0.06;
      ballAngle = Math.random()*Math.PI*2;
      ballR     = R_BALL;
      phase     = 'spin';
      doneCb    = cb;
      if(rafId) cancelAnimationFrame(rafId);
      animLoop();
    }

    frame(); /* initial still */

    /* ──────────────────────────────────────
       GAME STATE
    ────────────────────────────────────── */
    let balance      = 1000;
    let selectedChip = 25;
    let bets         = {};
    let lastBets     = {};
    let betStack     = [];
    let spinning     = false;
    let stats        = { spins:0, wins:0, net:0 };

    const CHIP_VALS = [5,25,50,100,250];
    const CHIP_COLS = ['#b45309','#1d4ed8','#166534','#7e22ce','#c2410c'];

    const balanceEl   = document.getElementById('balanceEl');
    const betEl       = document.getElementById('betEl');
    const resultEl    = document.getElementById('resultEl');
    const msgEl       = document.getElementById('msgEl');
    const spinBtn     = document.getElementById('spinBtn');
    const wheelResult = document.getElementById('wheelResult');

    function betTotal(){ return Object.values(bets).reduce((s,v)=>s+v,0); }
    function renderTop(){ balanceEl.textContent=balance.toLocaleString(); betEl.textContent=betTotal().toLocaleString(); }
    function renderBadges(){
      document.querySelectorAll('[data-bet-key]').forEach(el=>{
        const k=el.getAttribute('data-bet-key'), b=el.querySelector('.chip-badge');
        if(!b) return;
        const a=bets[k]||0;
        if(a>0){ b.textContent=a; b.classList.remove('hidden'); }
        else   { b.textContent='';    b.classList.add('hidden'); }
      });
    }

    function placeBet(key, amt){
      if(spinning) return;
      if(betTotal()+amt > balance){ msgEl.textContent='Not enough balance.'; return; }
      bets[key]=(bets[key]||0)+amt;
      betStack.push({key,amount:amt});
      msgEl.textContent='';
      renderTop(); renderBadges();
    }

    /* ──────────────────────────────────────
       BUILD TABLE  (standard European layout)
       Row 1 (top): 3,6,9,12,15,18,21,24,27,30,33,36
       Row 2 (mid): 2,5,8,11,14,17,20,23,26,29,32,35
       Row 3 (bot): 1,4,7,10,13,16,19,22,25,28,31,34
    ────────────────────────────────────── */
    const TABLE_ROWS=[
      [3,6,9,12,15,18,21,24,27,30,33,36],
      [2,5,8,11,14,17,20,23,26,29,32,35],
      [1,4,7,10,13,16,19,22,25,28,31,34]
    ];

    function mkBadge(){ const b=document.createElement('span'); b.className='chip-badge hidden'; return b; }

    function buildTable(){
      const grid=document.getElementById('tableGrid');
      /* zero */
      const z=document.createElement('div');
      z.className='t-cell t-green t-zero';
      z.setAttribute('data-bet-key','n_0');
      z.innerHTML='<span>0</span>';
      z.appendChild(mkBadge());
      z.addEventListener('click',()=>placeBet('n_0',selectedChip));
      grid.appendChild(z);
      /* numbers */
      TABLE_ROWS.forEach((row,ri)=>{
        row.forEach((num,ci)=>{
          const d=document.createElement('div');
          d.className='t-cell '+(numColor(num)==='red'?'t-red':'t-black');
          d.style.gridColumn=String(ci+2); d.style.gridRow=String(ri+1);
          d.setAttribute('data-bet-key','n_'+num);
          d.innerHTML='<span>'+num+'</span>';
          d.appendChild(mkBadge());
          d.addEventListener('click',()=>placeBet('n_'+num,selectedChip));
          grid.appendChild(d);
        });
      });
      /* 2-to-1 column bets */
      ['col3','col2','col1'].forEach((k,ri)=>{
        const d=document.createElement('div');
        d.className='t-cell t-2to1';
        d.style.gridColumn='14'; d.style.gridRow=String(ri+1);
        d.setAttribute('data-bet-key',k);
        d.innerHTML='<span>2 to 1</span>';
        d.appendChild(mkBadge());
        d.addEventListener('click',()=>placeBet(k,selectedChip));
        grid.appendChild(d);
      });
      /* dozens */
      const dRow=document.getElementById('dozensRow');
      const sp1=document.createElement('div'); sp1.className='o-cell o-sp'; dRow.appendChild(sp1);
      [['dozen1','1st 12'],['dozen2','2nd 12'],['dozen3','3rd 12']].forEach(([k,l])=>{
        const d=document.createElement('div'); d.className='o-cell';
        d.setAttribute('data-bet-key',k); d.textContent=l;
        d.appendChild(mkBadge());
        d.addEventListener('click',()=>placeBet(k,selectedChip));
        dRow.appendChild(d);
      });
      const sp2=document.createElement('div'); sp2.className='o-cell o-sp'; dRow.appendChild(sp2);
      /* even-money */
      const eRow=document.getElementById('evenRow');
      const sp3=document.createElement('div'); sp3.className='o-cell o-sp'; eRow.appendChild(sp3);
      [['low','1-18',''],['even','Even',''],['red','Red','o-red'],
       ['black','Black','o-blk'],['odd','Odd',''],['high','19-36','']].forEach(([k,l,ex])=>{
        const d=document.createElement('div'); d.className='o-cell '+ex;
        d.setAttribute('data-bet-key',k); d.textContent=l;
        d.appendChild(mkBadge());
        d.addEventListener('click',()=>placeBet(k,selectedChip));
        eRow.appendChild(d);
      });
      const sp4=document.createElement('div'); sp4.className='o-cell o-sp'; eRow.appendChild(sp4);
    }

    function buildChips(){
      const wrap=document.getElementById('chips');
      CHIP_VALS.forEach((v,i)=>{
        const btn=document.createElement('button');
        btn.className='chip text-white'+(v===selectedChip?' selected':'');
        btn.style.background=CHIP_COLS[i]; btn.textContent=v;
        btn.addEventListener('click',()=>{
          selectedChip=v;
          wrap.querySelectorAll('.chip').forEach(c=>c.classList.remove('selected'));
          btn.classList.add('selected');
        });
        wrap.appendChild(btn);
      });
    }

    /* ──────────────────────────────────────
       WIN CHECK & PAYOUT
    ────────────────────────────────────── */
    function checkWin(n,key){
      if(key.startsWith('n_')) return parseInt(key.slice(2))===n;
      if(n===0) return false;
      switch(key){
        case 'red':    return RED_SET.has(n);
        case 'black':  return BLACK_SET.has(n);
        case 'odd':    return n%2===1;
        case 'even':   return n%2===0;
        case 'low':    return n>=1&&n<=18;
        case 'high':   return n>=19&&n<=36;
        case 'dozen1': return n>=1&&n<=12;
        case 'dozen2': return n>=13&&n<=24;
        case 'dozen3': return n>=25&&n<=36;
        case 'col1':   return n%3===1;
        case 'col2':   return n%3===2;
        case 'col3':   return n%3===0;
        default: return false;
      }
    }
    function payMult(key){
      if(key.startsWith('n_')) return 36;
      if(['dozen1','dozen2','dozen3','col1','col2','col3'].includes(key)) return 3;
      return 2;
    }

    /* ──────────────────────────────────────
       SPIN
    ────────────────────────────────────── */
    function doSpin(){
      if(spinning) return;
      const t=betTotal();
      if(t<=0){ msgEl.textContent='Place a bet first!'; return; }
      if(t>balance){ msgEl.textContent='Bets exceed balance.'; return; }
      spinning=true; spinBtn.disabled=true;
      msgEl.innerHTML='&#127922; Spinning&hellip;';
      wheelResult.textContent=''; wheelResult.style.color='#fff';

      const win=Math.floor(Math.random()*37);
      spinWheel(win, ()=>{
        let payout=0, anyWin=false;
        Object.entries(bets).forEach(([k,a])=>{ if(checkWin(win,k)){ anyWin=true; payout+=a*payMult(k); } });
        balance-=t; balance+=payout;
        const net=payout-t; stats.spins++; stats.net+=net;
        if(net>0) stats.wins++;
        lastBets={...bets}; bets={}; betStack=[];
        spinning=false; spinBtn.disabled=false;

        const col=numColor(win);
        wheelResult.textContent=String(win);
        wheelResult.style.color=col==='red'?'#f87171':col==='green'?'#4ade80':'#f1f5f9';
        const em=col==='red'?'🔴':col==='black'?'⚫':'🟢';
        resultEl.textContent=em+' '+win;

        if(anyWin){
          msgEl.innerHTML='<span style="color:#4ade80;font-weight:700">&#10003; Winner! +'+payout.toLocaleString()+'</span>&nbsp;(net '+(net>=0?'+':'')+net.toLocaleString()+')';
        } else {
          msgEl.innerHTML='<span style="color:#f87171;font-weight:700">No win</span> &mdash; ball landed on <b>'+win+'</b> ('+net.toLocaleString()+')';
        }
        if(balance<=0){ balance=1000; msgEl.innerHTML+='&nbsp;<span style="color:#fbbf24">Balance refilled: 1,000 chips</span>'; }

        renderTop(); renderBadges();
        document.getElementById('statSpins').textContent=stats.spins;
        document.getElementById('statWins').textContent=stats.wins;
        const ne=document.getElementById('statNet');
        ne.textContent=(stats.net>=0?'+':'')+stats.net.toLocaleString();
        ne.className='text-base font-bold '+(stats.net>=0?'text-emerald-300':'text-red-300');
      });
    }

    /* controls */
    document.getElementById('spinBtn').addEventListener('click', doSpin);
    document.getElementById('clearBtn').addEventListener('click',()=>{
      if(spinning) return; bets={}; betStack=[]; renderTop(); renderBadges();
    });
    document.getElementById('undoBtn').addEventListener('click',()=>{
      if(spinning||!betStack.length) return;
      const l=betStack.pop();
      bets[l.key]=Math.max(0,(bets[l.key]||0)-l.amount);
      if(bets[l.key]===0) delete bets[l.key];
      renderTop(); renderBadges();
    });
    document.getElementById('repeatBtn').addEventListener('click',()=>{
      if(spinning||!Object.keys(lastBets).length) return;
      const add=Object.values(lastBets).reduce((s,v)=>s+v,0);
      if(betTotal()+add>balance){ msgEl.textContent='Not enough balance to repeat.'; return; }
      Object.entries(lastBets).forEach(([k,v])=>{ bets[k]=(bets[k]||0)+v; betStack.push({key:k,amount:v}); });
      renderTop(); renderBadges();
    });

    buildChips();
    buildTable();
    renderTop();
    </script>
  </body>
</html>
