<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pickr - Maintenance</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, rgba(122, 167, 255, 0.2), transparent 45%),
          radial-gradient(circle at 10% 20%, rgba(64, 217, 181, 0.25), transparent 40%),
          #0b0f1a;
        color: #e5e7eb;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      }
      .card {
        width: min(560px, 92vw);
        padding: 2.5rem 2.75rem;
        border-radius: 24px;
        background: rgba(12, 18, 32, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 28px 60px rgba(0, 0, 0, 0.55);
        text-align: center;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 2.1rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        color: rgba(226, 232, 240, 0.8);
        font-size: 1rem;
        line-height: 1.6;
      }
      .badge {
        display: inline-block;
        margin-bottom: 1rem;
        padding: 0.35rem 0.75rem;
        border-radius: 999px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-size: 0.7rem;
        background: rgba(255, 122, 26, 0.18);
        border: 1px solid rgba(255, 122, 26, 0.35);
        color: #ffcfad;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">Maintenance</div>
      <h1>Pickr is offline for updates</h1>
      <p>We are making a few improvements. Please check back shortly.</p>
    </main>
  </body>
</html>
