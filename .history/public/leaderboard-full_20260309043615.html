<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Pickr – Full Leaderboard</title>
    <link rel="icon" type="image/png" sizes="16x16" href="tablogo.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="tablogo.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="tablogo.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="tablogo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="tablogo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --ink: #0b0f1a;
        --ember: #ff7a1a;
        --mint: #40d9b5;
        --sky: #7aa7ff;
        --fog: rgba(255, 255, 255, 0.08);
        --card: rgba(17, 25, 40, 0.82);
      }
      body {
        font-family: 'IBM Plex Sans', sans-serif;
        background: radial-gradient(circle at top, rgba(122, 167, 255, 0.18), transparent 45%),
          radial-gradient(circle at 10% 20%, rgba(64, 217, 181, 0.2), transparent 40%),
          radial-gradient(circle at 90% 10%, rgba(255, 122, 26, 0.15), transparent 40%),
          var(--ink);
        color: #e5e7eb;
      }
      .hero-title { font-family: 'Space Grotesk', sans-serif; letter-spacing: -0.02em; }
      .glass {
        background: var(--card);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(12px);
      }
      .chip {
        background: rgba(64, 217, 181, 0.16);
        color: #7de6c9;
        border: 1px solid rgba(64, 217, 181, 0.4);
        padding: 0.35rem 0.75rem;
        border-radius: 999px;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }
      .nav-link { color: #94a3b8; transition: color 0.2s ease; }
      .nav-link:hover { color: #e2e8f0; }
      .nav-link.active { color: var(--ember); }
      .bottom-nav { padding-bottom: env(safe-area-inset-bottom); bottom: env(safe-area-inset-bottom); z-index: 50; }
      .page-main { padding-bottom: calc(9rem + env(safe-area-inset-bottom)); }
      @media (orientation: portrait) {
        .page-main { padding-bottom: calc(10rem + env(safe-area-inset-bottom)); }
      }
      .footer-safe { padding-bottom: calc(6rem + env(safe-area-inset-bottom)); }

      /* ── Mobile leaderboard: stop grid from crushing avatars ── */
      @media (max-width: 640px) {
        .grid-cols-12 {
          display: flex !important;
          flex-wrap: nowrap;
          align-items: center;
          gap: 0.5rem;
        }
        .grid-cols-12 > *:nth-child(1) {
          flex: 0 0 auto;
          min-width: 2.5rem;
        }
        .grid-cols-12 > *:nth-child(2) {
          flex: 1 1 0%;
          min-width: 0;
        }
        .grid-cols-12 > *:nth-child(3) {
          flex: 0 0 auto;
          min-width: 3rem;
          padding-left: 0.25rem;
        }
        .grid-cols-12 > *:nth-child(4),
        .grid-cols-12 > *:nth-child(5) {
          display: none !important;
        }
        .pickr-avatar {
          flex: 0 0 32px !important;
          width: 32px !important;
          height: 32px !important;
          min-width: 32px !important;
          min-height: 32px !important;
          max-width: 32px !important;
          max-height: 32px !important;
          border-radius: 999px !important;
          position: relative !important;
          overflow: hidden !important;
          transform: translateZ(0) !important;
          will-change: transform !important;
          contain: layout style size !important;
        }
        .grid-cols-12 > *:nth-child(2) > span.leaderboard-name-text {
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
          display: block;
          min-width: 0;
        }
        .grid-cols-12 > *:nth-child(2).flex {
          overflow: visible !important;
        }
      }
    </style>
  </head>
  <body class="flex flex-col min-h-screen">
    <div class="px-4">
      <header class="glass rounded-2xl p-5 mt-4 max-w-5xl mx-auto w-full flex items-center justify-between">
        <div>
          <div class="text-xs uppercase tracking-[0.35em] text-slate-400">Leaderboard</div>
          <h2 class="hero-title text-2xl sm:text-3xl tracking-tight text-slate-100">All players ranked</h2>
        </div>
        <img src="logo.png" alt="Pickr logo" class="h-[193px] w-[193px] sm:h-[250px] sm:w-[250px] object-contain flex-shrink-0 -my-16" />
      </header>
    </div>

    <main class="flex-1 px-4 pt-4 page-main">
      <div class="max-w-5xl mx-auto">
        <section class="glass rounded-2xl p-6 mb-6">
          <div class="flex flex-col gap-2 md:flex-row md:items-center md:justify-between">
            <div>
              <div class="text-xs uppercase tracking-[0.35em] text-emerald-200">Overall leaderboard</div>
              <h3 class="hero-title text-2xl">Top players by points</h3>
              <p class="text-slate-400 text-sm">Points combine wins, streaks, and XP momentum.</p>
            </div>
            <div class="chip">Updated live</div>
          </div>
          <div class="mt-5 overflow-hidden rounded-2xl border border-white/10">
            <div class="grid grid-cols-12 gap-2 bg-slate-900/70 px-4 py-3 text-xs uppercase tracking-widest text-slate-400">
              <div class="col-span-2">Rank</div>
              <div class="col-span-4">Player</div>
              <div class="col-span-2 text-right">Points</div>
              <div class="col-span-2 text-right">Wins</div>
              <div class="col-span-2 text-right">Streak</div>
            </div>
            <div id="playerLeaderboardList" class="divide-y divide-white/10 bg-slate-900/40">
              <div class="px-4 py-4 text-sm text-slate-400">Loading players...</div>
            </div>
          </div>
          <div class="mt-5 flex flex-col items-center gap-3">
            <button id="loadMoreLeaderboard" class="rounded-full border border-white/10 bg-white/5 px-5 py-2 text-xs uppercase tracking-[0.2em] text-slate-200 hover:border-white/30 hover:text-white">Load more</button>
            <div id="leaderboardStatus" class="text-xs text-slate-400"></div>
          </div>
        </section>
      </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/90 border-t border-white/5 shadow-inner flex text-xs bottom-nav">
      <a href="leaderboard.html" class="nav-link flex-1 flex flex-col items-center py-2">
        <span class="text-2xl">⭐</span>
        <span>Pickr Picks</span>
      </a>
      <a href="tasks.html" class="nav-link flex-1 flex flex-col items-center py-2">
        <span class="text-2xl">📝</span>
        <span>Tasks</span>
      </a>
      <a href="index.html" class="nav-link flex-1 flex flex-col items-center py-2">
        <span class="text-2xl">🏈</span>
        <span>Sports</span>
      </a>
      <a href="picks.html" class="nav-link flex-1 flex flex-col items-center py-2">
        <span class="text-2xl">📜</span>
        <span>My Bets</span>
      </a>
      <a href="wallet.html" class="nav-link flex-1 flex flex-col items-center py-2">
        <div class="pickr-avatar" data-size="24" aria-hidden="true"></div>
        <span>Wallet</span>
      </a>
    </nav>

    <script src="config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script>
      (function(){
        try {
          const firebaseConfig = {
            apiKey: "AIzaSyBoQ1myN6q1HeQQaT8RkH7lRBIKtHUQOdM",
            authDomain: "pickr-d4d9b.firebaseapp.com",
            projectId: "pickr-d4d9b",
            storageBucket: "pickr-d4d9b.firebasestorage.app",
            messagingSenderId: "972106331799",
            appId: "1:972106331799:web:d261170267bbd7dfaf5bd2",
            measurementId: "G-J0DC1K39NN"
          };
          if (!window.firebase) return;
          if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
          const auth = firebase.auth();
          try {
            const params = new URLSearchParams(window.location.search);
            const isLocalhost = ['localhost', '127.0.0.1'].includes(window.location.hostname);
            const useEmu = isLocalhost && (params.get('emulator') === '1' || localStorage.getItem('USE_FIREBASE_EMULATOR') === '1');
            if (useEmu) auth.useEmulator && auth.useEmulator('http://localhost:9099/');
          } catch (e) {}

          async function enforceProfile(user) {
            if (!user) {
              window.location.replace('/login.html');
              return;
            }
            try {
              const idToken = await user.getIdToken();
              const apiBase = (window.PICKR_CONFIG && window.PICKR_CONFIG.API_BASE_URL) || '';
              const resp = await fetch(apiBase + '/api/me', { headers: { Authorization: 'Bearer ' + idToken } });
              if (!resp.ok) {
                window.location.replace('/onboarding.html');
                return;
              }
              const profile = await resp.json();
              if (!profile || !profile.profileComplete || !profile.ageVerified) {
                window.location.replace('/onboarding.html');
                return;
              }
            } catch (e) {
              window.location.replace('/onboarding.html');
            }
          }

          auth.onAuthStateChanged(async (user) => {
            if (user) {
              try { if (typeof syncUserProfile === 'function') await syncUserProfile(); } catch (e) {}
            }
            enforceProfile(user);
          });

          window.addEventListener('pageshow', () => {
            if (auth.currentUser) {
              enforceProfile(auth.currentUser);
              return;
            }
            const unsub = auth.onAuthStateChanged((user) => {
              try { unsub && unsub(); } catch (e) {}
              enforceProfile(user);
            });
          });
        } catch (e) { /* ignore */ }
      })();
    </script>
    <script src="script.js?v=20260219-1"></script>
    <script>
      (function () {
        const apiBase = (window.PICKR_CONFIG && window.PICKR_CONFIG.API_BASE_URL) || '';
        const listEl = document.getElementById('playerLeaderboardList');
        const loadMoreBtn = document.getElementById('loadMoreLeaderboard');
        const statusEl = document.getElementById('leaderboardStatus');
        if (!listEl || !loadMoreBtn) return;

        let cursor = null;
        let loading = false;
        let loadedCount = 0;
        let done = false;

        async function getAuthHeaders() {
          const headers = {};
          try {
            if (window.firebase && firebase.auth && firebase.auth().currentUser) {
              const idToken = await firebase.auth().currentUser.getIdToken();
              headers.Authorization = 'Bearer ' + idToken;
              return headers;
            }
          } catch (e) {}
          const isLocalhost = ['localhost', '127.0.0.1'].includes(window.location.hostname);
          const devUid = localStorage.getItem('DEV_AUTH_UID') || (isLocalhost ? 'test-user-123' : null);
          if (devUid) headers['x-dev-uid'] = devUid;
          return headers;
        }

        function renderRows(players, append) {
          if (!players || players.length === 0) {
            if (!append) {
              listEl.innerHTML = '<div class="px-4 py-4 text-sm text-slate-400">No leaderboard data yet.</div>';
            }
            return;
          }
          if (!append) listEl.innerHTML = '';
          let displayRank = 0;
          players.forEach((player) => {
            const row = document.createElement('div');
            row.className = 'grid grid-cols-12 gap-2 px-4 py-4 text-sm text-slate-200 items-center';
            const nameRaw = String(player.name || '').trim();
            if (!nameRaw || nameRaw.includes('@') || nameRaw !== nameRaw.toUpperCase()) return;
            if (!/^[A-Z0-9_.]+$/.test(nameRaw)) return;
            displayRank += 1;
            const rank = loadedCount + displayRank;
            const name = nameRaw;
            const avatarId = player.avatarId || '';
            const points = Number(player.points || 0);
            const wins = Number(player.wins || 0);
            const streak = Number(player.streakWins || 0);

            const rankEl = document.createElement('div');
            rankEl.className = 'col-span-2 text-slate-400';
            rankEl.textContent = `#${rank}`;

            const nameEl = document.createElement('div');
            nameEl.className = 'col-span-4 font-semibold flex items-center gap-3';
            const avatarEl = document.createElement('div');
            avatarEl.className = 'pickr-avatar';
            avatarEl.setAttribute('data-size', '32');
            if (avatarId) avatarEl.setAttribute('data-avatar-id', avatarId);
            // Render avatar immediately — don't defer to refreshAvatars()
            if (window.PickrApp && typeof window.PickrApp.renderAvatar === 'function') {
              window.PickrApp.renderAvatar(avatarEl, avatarId || 'avatar-1');
            }
            const nameText = document.createElement('span');
            nameText.className = 'leaderboard-name-text';
            nameText.textContent = String(name);
            nameEl.appendChild(avatarEl);
            nameEl.appendChild(nameText);

            const pointsEl = document.createElement('div');
            pointsEl.className = 'col-span-2 text-right font-semibold text-emerald-200';
            pointsEl.textContent = points.toLocaleString();

            const winsEl = document.createElement('div');
            winsEl.className = 'col-span-2 text-right';
            winsEl.textContent = String(wins);

            const streakEl = document.createElement('div');
            streakEl.className = 'col-span-2 text-right';
            streakEl.textContent = String(streak);

            row.appendChild(rankEl);
            row.appendChild(nameEl);
            row.appendChild(pointsEl);
            row.appendChild(winsEl);
            row.appendChild(streakEl);
            listEl.appendChild(row);
          });
          loadedCount += displayRank;
          if (window.PickrApp && typeof window.PickrApp.refreshAvatars === 'function') {
            window.PickrApp.refreshAvatars();
          }
        }

        async function loadMore() {
          if (loading || done) return;
          loading = true;
          loadMoreBtn.disabled = true;
          loadMoreBtn.textContent = 'Loading...';
          if (statusEl) statusEl.textContent = '';
          try {
            const headers = await getAuthHeaders();
            const params = new URLSearchParams({ limit: '50' });
            if (cursor) {
              params.set('startAfterPoints', String(cursor.startAfterPoints));
            }
            const res = await fetch(apiBase + '/api/leaderboard/players?' + params.toString(), { headers });
            const data = await res.json();
            if (!res.ok) throw new Error(data && data.error ? data.error : 'Failed to load leaderboard');
            renderRows(data.players || [], !!cursor);
            cursor = data.nextCursor || null;
            if (!cursor || !data.players || data.players.length < 50) {
              done = true;
              loadMoreBtn.classList.add('hidden');
              if (statusEl) statusEl.textContent = 'All players loaded.';
            }
          } catch (err) {
            if (statusEl) statusEl.textContent = 'Failed to load leaderboard.';
          } finally {
            loading = false;
            loadMoreBtn.disabled = false;
            loadMoreBtn.textContent = 'Load more';
          }
        }

        document.addEventListener('DOMContentLoaded', () => {
          loadMore();
        });
        loadMoreBtn.addEventListener('click', loadMore);
      })();
    </script>
  </body>
</html>
